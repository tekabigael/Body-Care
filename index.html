<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scented Bliss Shop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fdf6f0;
      color: #333;
    }
    header {
      background: #d4a373;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    nav a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
    }
    #hero {
      text-align: center;
      padding: 2rem;
      background: #f1e3d3;
    }
    .product-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 2rem;
    }
    .product {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    button {
      background: #d4a373;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Scented Bliss</h1>
    <nav>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="hero">
    <h2>Luxury Body Butters, Shower Gels & Soaps</h2>
    <p>Indulge in natural scents and silky textures.</p>
    <button onclick="alert('Shop coming soon!')">Shop Now</button>
  </section>

  <section id="products">
    <h2>Our Products</h2>
    <div class="product-grid">
      <div class="product">
        <h3>Scented Body Butter</h3>
        <p>$15</p>
        <button onclick="addToCart('Body Butter')">Add to Cart</button>
      </div>
      <div class="product">
        <h3>Refreshing Shower Gel</h3>
        <p>$12</p>
        <button onclick="addToCart('Shower Gel')">Add to Cart</button>
      </div>
      <div class="product">
        <h3>Handmade Soap</h3>
        <p>$8</p>
        <button onclick="addToCart('Soap')">Add to Cart</button>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Scented Bliss. All rights reserved.</p>
  </footer>

  <script>
    let cart = [];
    function addToCart(item) {
      cart.push(item);
      alert(item + " added to cart!");
    }
  </script>
</body>
</html>
